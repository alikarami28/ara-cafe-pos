backend:
  name: github
  repo: YOUR-USERNAME/ara-cafe-pos  # نام ریپوی GitHub
  branch: main
  base_url: https://ara-cafe.vercel.app
  auth_endpoint: api/auth

media_folder: "images/products"
public_folder: "/images/products"

collections:
  - name: "products"
    label: "محصولات"
    folder: "data"
    create: true
    slug: "{{slug}}"
    format: "json"
    extension: "json"
    
    fields:
      - { label: "شناسه", name: "id", widget: "number", required: true }
      - { label: "نام محصول", name: "name", widget: "string", required: true }
      - { label: "توضیحات", name: "description", widget: "text", required: false }
      - { label: "قیمت (ریال)", name: "price", widget: "number", required: true }
      - { 
          label: "دسته‌بندی", 
          name: "category", 
          widget: "select", 
          options: 
            - { label: "نوشیدنی گرم", value: "hot" }
            - { label: "نوشیدنی سرد", value: "cold" }
            - { label: "چای و دمنوش", value: "tea" }
            - { label: "کیک و دسر", value: "dessert" }
          required: true 
        }
      - { label: "تصویر", name: "image", widget: "image", required: false }
      - { label: "فعال", name: "active", widget: "boolean", default: true }
      - { label: "ترتیب نمایش", name: "sortOrder", widget: "number", required: true }

  - name: "settings"
    label: "تنظیمات"
    files:
      - file: "data/products.json"
        label: "محصولات و دسته‌بندی‌ها"
        name: "products_data"
        fields:
          - name: "products"
            label: "لیست محصولات"
            widget: "list"
            fields:
              - { label: "شناسه", name: "id", widget: "number" }
              - { label: "نام", name: "name", widget: "string" }
              - { label: "توضیحات", name: "description", widget: "text" }
              - { label: "قیمت", name: "price", widget: "number" }
              - { label: "دسته‌بندی", name: "category", widget: "string" }
              - { label: "تصویر", name: "image", widget: "image" }
              - { label: "فعال", name: "active", widget: "boolean" }
              - { label: "ترتیب", name: "sortOrder", widget: "number" }
          - name: "categories"
            label: "دسته‌بندی‌ها"
            widget: "list"
            fields:
              - { label: "شناسه", name: "id", widget: "string" }
              - { label: "نام", name: "name", widget: "string" }
              - { label: "آیکون", name: "icon", widget: "string" }