backend:
  name: github
  repo: YOUR-USERNAME/ara-cafe-pos
  branch: main

media_folder: "images/products"
public_folder: "/images/products"

collections:
  - name: "products"
    label: "محصولات کافه"
    folder: "data"
    create: true
    fields:
      - { label: "شناسه", name: "id", widget: "number" }
      - { label: "نام محصول", name: "name", widget: "string" }
      - { label: "توضیحات", name: "description", widget: "text" }
      - { label: "قیمت (ریال)", name: "price", widget: "number" }
      - label: "دسته‌بندی"
        name: "category"
        widget: "select"
        options: ["hot", "cold", "tea", "dessert"]
      - { label: "تصویر", name: "image", widget: "image", required: false }
      - { label: "فعال", name: "active", widget: "boolean", default: true }
      - { label: "ترتیب نمایش", name: "sortOrder", widget: "number" }
